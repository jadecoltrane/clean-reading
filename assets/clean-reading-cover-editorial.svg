<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="cr-title cr-description">
<title id="cr-title">Clean Reading · A quieter way to read</title>
<desc id="cr-description">简约的 Clean Reading 封面，左侧为名称和简介，右侧为中文文章层级、引文与清单的排版示意。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfbfb"/><stop offset="1" stop-color="#f9f8fa"/></linearGradient>
  <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#918c9a" flood-opacity=".15"/></filter>
</defs>
<rect width="1440" height="720" fill="url(#paper)"/>
<path d="M0 0H390C287 133 143 191 0 247Z" fill="#f3f2f5"/>
<path d="M1440 720H1030C1145 573 1281 530 1440 484Z" fill="#f2f1f4"/>

<!-- 左侧品牌：克制的图标、标题和一句描述 -->
<g transform="translate(112 189)" fill="none" stroke="#70717a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M0 17a16 16 0 0 1 16-16h60l27 27v91a16 16 0 0 1-16 16H16a16 16 0 0 1-16-16Z"/>
  <path d="M76 1v27h27"/><path d="M27 58h47M27 78h47M27 98h30"/>
</g>
<text x="105" y="401" fill="#252528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="79" font-weight="650" letter-spacing="-2">Clean Reading</text>
<text x="110" y="453" fill="#696972" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" letter-spacing=".5">A clean, comfortable reading style for Obsidian</text>
<rect x="110" y="486" width="52" height="3" rx="1.5" fill="#9287a6"/>

<!-- 右侧仅示意文章阅读，不伪造 Obsidian 应用界面 -->
<g transform="rotate(-2 1085 363)">
  <rect x="833" y="70" width="518" height="589" rx="21" fill="#ffffff" stroke="#edebef" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="871" y="119" width="38" height="3" rx="1.5" fill="#8a7ba2"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <text x="873" y="173" font-size="31" font-weight="650" fill="#2d2d32">留一点空白给思考</text>
    <text x="874" y="229" font-size="17" fill="#52545c">好的阅读，并不是把更多内容塞进一页，</text>
    <text x="874" y="260" font-size="17" fill="#52545c">而是让文字、结构与留白各得其所。</text>
    <text x="873" y="329" font-size="23" font-weight="600" fill="#2d2e33">一、阅读的节奏</text>
    <text x="874" y="368" font-size="17" fill="#53545c">清楚的层级让视线自然往下走。</text>
    <text x="874" y="396" font-size="17" fill="#53545c">适当的行距，让每一句都有呼吸感。</text>
  </g>
  <rect x="871" y="431" width="442" height="94" rx="8" fill="#f6f5f7"/>
  <rect x="871" y="431" width="3" height="94" rx="1.5" fill="#9186a7"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <text x="892" y="467" font-size="18" font-weight="600" fill="#4a4852">一段值得记住的话</text>
    <text x="892" y="497" font-size="16" fill="#62616a">让界面退后，让阅读发生。</text>
    <text x="911" y="569" font-size="16" fill="#565861">标题清晰，正文舒展</text>
    <text x="911" y="606" font-size="16" fill="#565861">让注意力回到内容</text>
  </g>
  <rect x="874" y="554" width="17" height="17" rx="3" fill="none" stroke="#96939d" stroke-width="1.5"/>
  <rect x="874" y="591" width="17" height="17" rx="3" fill="none" stroke="#96939d" stroke-width="1.5"/>
  <path d="M878 600l4 4 7-9" fill="none" stroke="#88819b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>