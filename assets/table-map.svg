<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="402" viewBox="0 0 1200 402" role="img" aria-labelledby="title desc"><title id="title">Clean Reading 表格结构示意</title><desc id="desc">全宽表格，透明表头，无外框及竖线，只保留浅横线，末行没有底线。非截图。</desc><rect width="100%" height="100%" rx="16" fill="#fafafa"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="27" fill="#353535" font-weight="550">表格只保留必要的横向分隔</text><text x="36" y="78" font-size="16" fill="#777" font-weight="400">铺满正文阅读列 · 透明表头与单元格 · 无外框和竖线 · 非实机截图</text><rect x="36" y="104" width="1128" height="266" rx="0" fill="#fff"/><text x="60" y="144" font-size="21" fill="#353535" font-weight="500">元素</text><text x="350" y="144" font-size="21" fill="#353535" font-weight="500">样式</text><text x="720" y="144" font-size="21" fill="#353535" font-weight="500">阅读效果</text><path d="M60 164H1140" stroke="#e5e5e5"/><text x="60" y="208" font-size="21" fill="#353535" font-weight="400">标题</text><text x="350" y="208" font-size="21" fill="#353535" font-weight="400">字号与留白</text><text x="720" y="208" font-size="21" fill="#353535" font-weight="400">层级清楚</text><path d="M60 228H1140" stroke="#e5e5e5"/><text x="60" y="272" font-size="21" fill="#353535" font-weight="400">正文</text><text x="350" y="272" font-size="21" fill="#353535" font-weight="400">行宽、行距</text><text x="720" y="272" font-size="21" fill="#353535" font-weight="400">自然连贯</text><path d="M60 292H1140" stroke="#e5e5e5"/><text x="60" y="336" font-size="21" fill="#353535" font-weight="400">表格</text><text x="350" y="336" font-size="21" fill="#353535" font-weight="400">浅横线、末行无底线</text><text x="720" y="336" font-size="21" fill="#353535" font-weight="400">内容之间保留空间</text></g></svg>
