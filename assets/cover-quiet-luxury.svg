<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-label="Clean Reading 静奢风项目封面，阅读界面为设计示意"><defs><filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#35312b" flood-opacity=".11"/></filter><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#8c7ba3" opacity=".24"/></pattern></defs><rect x="0" y="0" width="2400" height="1400" rx="0" fill="#f2f0eb" stroke="none" /><text x="104" y="108" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#827e77" letter-spacing="4">JADECOLTRANE  /  OBSIDIAN CSS</text><path d="M104 155H2296" stroke="#ddd9d1" stroke-width="1"/><text x="96" y="359" font-family="Georgia,Times New Roman,serif" font-size="132" font-weight="400" fill="#292b29" letter-spacing="0">Clean</text><text x="96" y="493" font-family="Georgia,Times New Roman,serif" font-size="132" font-weight="400" fill="#292b29" letter-spacing="0">Reading</text><text x="104" y="628" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="500" fill="#292b29" letter-spacing="0">让阅读，回到文字。</text><text x="106" y="696" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#827e77" letter-spacing="0">一份克制的 Obsidian 阅读增强 CSS</text><text x="106" y="844" font-family="Georgia,Times New Roman,serif" font-size="42" font-weight="400" fill="#292b29" letter-spacing="0">15px</text><text x="106" y="884" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#827e77" letter-spacing="0">正文默认字号</text><text x="340" y="844" font-family="Georgia,Times New Roman,serif" font-size="42" font-weight="400" fill="#292b29" letter-spacing="0">1.8</text><text x="340" y="884" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#827e77" letter-spacing="0">正文行距</text><text x="526" y="844" font-family="Georgia,Times New Roman,serif" font-size="42" font-weight="400" fill="#292b29" letter-spacing="0">108%</text><text x="526" y="884" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#827e77" letter-spacing="0">H1 / H2 字号比</text><g transform="translate(828 291) scale(1.07)"><rect x="0" y="0" width="1360" height="840" rx="20" fill="#ffffff" stroke="#e3e3e3" filter="url(#shadow)"/><rect x="1" y="1" width="1358" height="53" rx="19" fill="#f4f4f4" stroke="none" /><rect x="1" y="30" width="1358" height="24" rx="0" fill="#f4f4f4" stroke="none" /><circle cx="25" cy="27" r="4" fill="#888888" opacity=".6"/><circle cx="45" cy="27" r="4" fill="#888888" opacity=".6"/><circle cx="65" cy="27" r="4" fill="#888888" opacity=".6"/><text x="106" y="35" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#888888" letter-spacing="0">阅读笔记</text><text x="1190" y="35" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#888888" letter-spacing="0">Clean Reading</text><rect x="1" y="54" width="228" height="766" rx="0" fill="#fcfcfc" stroke="none" /><path d="M1 54H1359" stroke="#e3e3e3" stroke-width="1"/><path d="M229 54V820" stroke="#e3e3e3"/><text x="28" y="111" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#888888" letter-spacing="3">NOTES</text><rect x="18" y="141" width="194" height="42" rx="8" fill="#eff0f0" stroke="none" /><text x="35" y="169" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#353535" letter-spacing="0">阅读与留白</text><text x="35" y="225" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#888888" letter-spacing="0">随手记录</text><text x="35" y="280" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#888888" letter-spacing="0">书页之间</text><text x="35" y="335" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#888888" letter-spacing="0">灵感札记</text><text x="321" y="124" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="550" fill="#353535" letter-spacing="0">把时间留给一段好文字</text><text x="321" y="185" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#353535" letter-spacing="0">读书不必匆忙，记录也无需喧哗。</text><text x="321" y="228" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#353535" letter-spacing="0">适当的行宽与留白，让思绪慢慢展开。</text><text x="321" y="302" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27.78" font-weight="550" fill="#353535" letter-spacing="0">一、阅读的节奏</text><text x="321" y="355" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#353535" letter-spacing="0">文字之间有距离，想法之间就有了余地。</text><text x="321" y="400" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#353535" letter-spacing="0">不需要每一句都强调，让重点自然浮现。</text><text x="321" y="454" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#8c7ba3" letter-spacing="0">延伸阅读</text><path d="M321 463H409" stroke="#8c7ba3" stroke-dasharray="1 4"/><rect x="318" y="495" width="934" height="132" rx="8" fill="#f7f6fa" stroke="none" /><rect x="318" y="495" width="934" height="132" rx="8" fill="url(#dots)" stroke="none" /><text x="341" y="538" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" fill="#353535" letter-spacing="0">阅读提示</text><text x="341" y="580" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#353535" letter-spacing="0">把页面留给内容，把注意力留给当下。</text><text x="321" y="694" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#888888" letter-spacing="0">元素</text><text x="600" y="694" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#888888" letter-spacing="0">样式</text><text x="918" y="694" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#888888" letter-spacing="0">阅读感受</text><path d="M321 716H1251" stroke="#e3e3e3" stroke-width="1"/><text x="321" y="756" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#353535" letter-spacing="0">正文</text><text x="600" y="756" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#353535" letter-spacing="0">舒展的行距</text><text x="918" y="756" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#353535" letter-spacing="0">安静、连贯</text></g><path d="M104 1270H2296" stroke="#ddd9d1" stroke-width="1"/><text x="104" y="1322" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#827e77" letter-spacing="3">A QUIETER WAY TO READ.</text><text x="1900" y="1322" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#827e77" letter-spacing="0">版式示意 · 非实机截图</text></svg>