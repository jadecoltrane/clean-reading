<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-label="Clean Reading 版式设计示意图"><defs><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#b2b9cc" opacity=".42"/></pattern><pattern id="dotsDark" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#9198a9" opacity=".25"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#141c35" flood-opacity=".1"/></filter></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><rect x="0" y="0" width="1500" height="920" rx="0" fill="#f2f4f8" stroke="none" stroke-width="1"/><text x="105" y="100" fill="#253044" font-size="52" font-weight="630" >细节决定阅读的节奏</text><text x="105" y="151" fill="#798390" font-size="23" font-weight="400" >保留 Border 的结构感，让正文成为真正的主角。</text><rect x="99" y="203" width="620" height="287" rx="18" fill="#fff" stroke="#e0e6ef" stroke-width="1"/><text x="129" y="252" fill="#253044" font-size="23" font-weight="630" >01  标题与引用，分清角色</text><rect x="131" y="278" width="4" height="33" rx="2" fill="#2563eb" stroke="none" stroke-width="1"/><text x="151" y="304" fill="#253044" font-size="25" font-weight="580" >标题帮助定位信息</text><rect x="130" y="328" width="551" height="130" rx="10" fill="#f0f3f9" stroke="none" stroke-width="1"/><rect x="130" y="328" width="551" height="130" rx="10" fill="url(#dots)" stroke="none" stroke-width="1"/><text x="155" y="363" fill="#253044" font-size="19" font-weight="420" >引用是补充说明，而不是另一个标题。</text><text x="155" y="395" fill="#253044" font-size="18" font-weight="420" >取消左边的线，用淡点阵和留白来分组。</text><text x="155" y="435" fill="#798390" font-size="15" font-weight="500" >无竖线  ·  无外框</text><rect x="750" y="203" width="652" height="287" rx="18" fill="#fff" stroke="#e0e6ef" stroke-width="1"/><text x="784" y="252" fill="#253044" font-size="23" font-weight="630" >02  链接，颜色之外再给提示</text><text x="786" y="314" fill="#2563eb" font-size="27" font-weight="500" >打开外部资料</text><line x1="786" y1="324" x2="963" y2="324" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 5" /><text x="977" y="312" fill="#2563eb" font-size="23" font-weight="400" >↗</text><text x="786" y="368" fill="#253044" font-size="20" font-weight="400" >内链和外链使用同一蓝色，</text><text x="786" y="400" fill="#253044" font-size="20" font-weight="400" >细点状下划线让它们更容易被识别。</text><rect x="99" y="527" width="1303" height="291" rx="18" fill="#fff" stroke="#e0e6ef" stroke-width="1"/><text x="130" y="574" fill="#253044" font-size="23" font-weight="630" >03  列表与表格，把信息摆整齐</text><text x="132" y="624" fill="#253044" font-size="22" font-weight="440" >•  列表缩进更克制</text><text x="154" y="663" fill="#798390" font-size="20" font-weight="400" >◦  子级仍有清楚的层次</text><text x="132" y="703" fill="#253044" font-size="22" font-weight="440" >•  行距舒展，不必靠反复加粗</text><line x1="761" y1="614" x2="1367" y2="614" stroke="#e0e6ef" stroke-width="1.5"  /><text x="792" y="651" fill="#253044" font-size="20" font-weight="600" >元素</text><text x="1040" y="651" fill="#253044" font-size="20" font-weight="600" >阅读方式</text><line x1="761" y1="674" x2="1367" y2="674" stroke="#e0e6ef" stroke-width="1"  /><text x="792" y="711" fill="#253044" font-size="19" font-weight="400" >正文</text><text x="1040" y="711" fill="#253044" font-size="19" font-weight="400" >清晰、连续、稳定</text><line x1="761" y1="736" x2="1367" y2="736" stroke="#e0e6ef" stroke-width="1"  /><text x="792" y="771" fill="#253044" font-size="19" font-weight="400" >表格</text><text x="1040" y="771" fill="#253044" font-size="19" font-weight="400" >浅横线，避免网格噪声</text><text x="1393" y="884" fill="#798390" font-size="17" font-weight="400" text-anchor="end">组件示意图 · 非 Obsidian 实拍</text></g></svg>