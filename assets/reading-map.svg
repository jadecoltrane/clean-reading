<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-labelledby="title desc"><title id="title">Clean Reading 当前阅读排版示意</title><desc id="desc">一级标题常规文字色，大小为二级标题的108%，两者无通栏底线。正文15px，居中列65%，最大820px。非截图。</desc><rect width="100%" height="100%" rx="16" fill="#fafafa"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="27" fill="#353535" font-weight="550">让正文成为页面的中心</text><text x="36" y="78" font-size="16" fill="#777" font-weight="400">根据当前 CSS 参数绘制 · 结构示意，非实机截图</text><rect x="36" y="104" width="746" height="408" rx="10" fill="#fff"/><text x="106" y="151" font-size="28.08" fill="#353535" font-weight="550">一级标题 · 正常文字色</text><text x="106" y="183" font-size="18" fill="#353535" font-weight="400">比二级标题大 8%，不加竖线或底线。</text><text x="106" y="237" font-size="26" fill="#353535" font-weight="550">二级标题 · 字号与留白</text><text x="106" y="279" font-size="20" fill="#353535" font-weight="400">文字轻重有别，阅读节奏保持自然。</text><text x="106" y="315" font-size="20" fill="#353535" font-weight="400">段落之间留出空间，让视线顺着内容往下走。</text><circle cx="112" cy="363" r="3" fill="#8b6bff"/><text x="126" y="370" font-size="23.4" fill="#353535" font-weight="500">三级标题 · 小圆点</text><text x="106" y="415" font-size="20" fill="#8b6bff" font-weight="400">内链与外链沿用主题的链接颜色</text><path d="M106 424H446" stroke="#8b6bff" stroke-dasharray="1 4"/><text x="106" y="468" font-size="17" fill="#777" font-weight="400">正文示意 · 字体遵循 Obsidian 外观设置</text><text x="824" y="146" font-size="23" fill="#353535" font-weight="550">15px / 400</text><text x="824" y="178" font-size="16" fill="#666" font-weight="400">正文与文件名的默认字号、字重</text><text x="824" y="243" font-size="23" fill="#353535" font-weight="550">65% · 最大 820px</text><text x="824" y="275" font-size="16" fill="#666" font-weight="400">居中阅读列，窄窗口按可用宽度适配</text><text x="824" y="340" font-size="23" fill="#353535" font-weight="550">H1 = H2 × 1.08</text><text x="824" y="372" font-size="16" fill="#666" font-weight="400">常规文字色，用比例建立层级</text><text x="824" y="437" font-size="23" fill="#353535" font-weight="550">约 1.8 倍行距</text><text x="824" y="469" font-size="16" fill="#666" font-weight="400">正文段后间距 1.1em</text></g></svg>
