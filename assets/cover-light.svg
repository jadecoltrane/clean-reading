<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-label="Clean Reading 版式设计示意图"><defs><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#b2b9cc" opacity=".42"/></pattern><pattern id="dotsDark" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#9198a9" opacity=".25"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#141c35" flood-opacity=".1"/></filter></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><rect x="0" y="0" width="1500" height="920" rx="0" fill="#f3f5f9" stroke="none" stroke-width="1"/><circle cx="1340" cy="86" r="270" fill="#2563eb" opacity=".045"/><circle cx="80" cy="770" r="230" fill="#2563eb" opacity=".03"/><text x="110" y="91" fill="#2563eb" font-size="20" font-weight="700" letter-spacing="4">CLEAN  /  READING</text><text x="110" y="178" fill="#253044" font-size="56" font-weight="630" >为长文留出舒服的呼吸感</text><text x="111" y="232" fill="#7b8391" font-size="24" font-weight="400" >Obsidian × Border  ·  只优化阅读，不打扰界面</text><rect x="110" y="260" width="159" height="39" rx="20" fill="#e7efff" stroke="none" stroke-width="1"/><text x="132" y="287" fill="#2563eb" font-size="19" font-weight="600" >65% 居中</text><rect x="285" y="260" width="149" height="39" rx="20" fill="#e7efff" stroke="none" stroke-width="1"/><text x="307" y="287" fill="#2563eb" font-size="19" font-weight="600" >1.8 行距</text><rect x="451" y="260" width="193" height="39" rx="20" fill="#e7efff" stroke="none" stroke-width="1"/><text x="471" y="287" fill="#2563eb" font-size="19" font-weight="600" >无边框点阵引用</text><g filter="url(#shadow)"><rect x="110" y="325" width="1280" height="529" rx="16" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/></g><rect x="111" y="326" width="1278" height="53" rx="15" fill="#edf0f5" stroke="none" stroke-width="1"/><rect x="111" y="357" width="1278" height="22" rx="0" fill="#edf0f5" stroke="none" stroke-width="1"/><rect x="131" y="348" width="12" height="12" rx="6" fill="#2563eb" stroke="none" stroke-width="1"/><text x="154" y="359" fill="#253044" font-size="18" font-weight="600" >Notes</text><text x="1250" y="358" fill="#7b8391" font-size="16" font-weight="500" >Light preview</text><line x1="112" y1="379" x2="1389" y2="379" stroke="#dfe3ec" stroke-width="1"  /><rect x="111" y="380" width="228" height="473" rx="0" fill="#f8f9fb" stroke="none" stroke-width="1"/><line x1="339" y1="380" x2="339" y2="853" stroke="#dfe3ec" stroke-width="1"  /><text x="139" y="431" fill="#7b8391" font-size="14" font-weight="700" letter-spacing="2">WORKSPACE</text><rect x="132" y="456" width="190" height="39" rx="7" fill="#e9eef6" stroke="none" stroke-width="1"/><text x="146" y="481" fill="#253044" font-size="17" font-weight="580" >阅读笔记</text><text x="149" y="533" fill="#7b8391" font-size="17" font-weight="400" >随手记录</text><text x="149" y="578" fill="#7b8391" font-size="17" font-weight="400" >阅读摘录</text><text x="149" y="623" fill="#7b8391" font-size="17" font-weight="400" >想法整理</text><text x="149" y="668" fill="#7b8391" font-size="17" font-weight="400" >灵感清单</text><text x="401" y="433" fill="#253044" font-size="28" font-weight="600" >让信息清楚地被看见</text><rect x="398" y="410" width="4" height="30" rx="2" fill="#2563eb" stroke="none" stroke-width="1"/><text x="400" y="485" fill="#253044" font-size="19" font-weight="400" >一段文字，只表达一件事。适当的行宽与段落间距，</text><text x="400" y="519" fill="#253044" font-size="19" font-weight="400" >让眼睛更容易找到下一行，也更容易区分不同想法。</text><text x="400" y="554" fill="#253044" font-size="19" font-weight="400" >不需要每一句都强调；</text><text x="612" y="554" fill="#253044" font-size="19" font-weight="560" >让重点自己浮出来。</text><text x="400" y="594" fill="#2563eb" font-size="19" font-weight="500" >相关链接</text><line x1="400" y1="602" x2="476" y2="602" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 4" /><text x="483" y="594" fill="#2563eb" font-size="17" font-weight="400" >↗</text><text x="527" y="594" fill="#253044" font-size="18" font-weight="400" >使用蓝色细点线，在颜色之外再加一层提示。</text><rect x="398" y="620" width="889" height="101" rx="9" fill="#f1f4f8" stroke="none" stroke-width="1"/><rect x="398" y="620" width="889" height="101" rx="9" fill="url(#dots)" stroke="none" stroke-width="1"/><text x="418" y="656" fill="#253044" font-size="20" font-weight="600" >阅读提示</text><text x="418" y="692" fill="#253044" font-size="18" font-weight="400" >标题已经有竖线；引用块改用点阵与圆角，层级就不会混淆。</text><text x="400" y="764" fill="#253044" font-size="19" font-weight="400" >排版不是装饰，它帮助内容被更自然地理解。</text><line x1="397" y1="793" x2="1287" y2="793" stroke="#dfe3ec" stroke-width="1"  /><text x="399" y="819" fill="#7b8391" font-size="15" font-weight="400" >示例笔记  /  只演示排版关系</text><text x="1390" y="894" fill="#7b8391" font-size="17" font-weight="400" text-anchor="end">设计示意图 · 非 Obsidian 实拍</text></g></svg>