<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="478" viewBox="0 0 1200 478" role="img" aria-labelledby="title desc"><title id="title">主题色点阵与四类语义色示意</title><desc id="desc">引用与Callout使用统一极浅带色底与8px圆角，点阵保留主题色。语义色为蓝、黄橙、红、绿。非截图。</desc><rect width="100%" height="100%" rx="16" fill="#fafafa"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><defs><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.65" fill="#8a6df5" opacity=".24"/></pattern></defs><text x="36" y="48" font-size="27" fill="#353535" font-weight="550">一点主题色，保留内容的语义</text><text x="36" y="78" font-size="16" fill="#777" font-weight="400">引用与 Callout 示意 · 非实机截图；紫色仅为强调色示例</text><rect x="36" y="108" width="1128" height="100" rx="8" fill="#f8f7fa"/><rect x="36" y="108" width="1128" height="100" rx="8" fill="url(#dots)"/><rect x="36" y="226" width="1128" height="114" rx="8" fill="#f8f7fa"/><rect x="36" y="226" width="1128" height="114" rx="8" fill="url(#dots)"/><text x="60" y="150" font-size="22" fill="#353535" font-weight="400">引用是一段补充说明。</text><text x="60" y="185" font-size="19" fill="#353535" font-weight="400">正文保持正常字号、颜色和字重；没有左侧竖线和外框。</text><text x="60" y="265" font-size="22" fill="#353535" font-weight="500">阅读提示</text><text x="60" y="305" font-size="19" fill="#353535" font-weight="400">8px 圆角 · 极浅带色底 · 点阵以 24% 不透明度显示</text><circle cx="46" cy="389" r="7" fill="#436da4"/><text x="66" y="396" font-size="20" fill="#436da4" font-weight="400">Info / Tip</text><circle cx="326" cy="389" r="7" fill="#d07932"/><text x="346" y="396" font-size="20" fill="#d07932" font-weight="400">Warning</text><circle cx="606" cy="389" r="7" fill="#b3484e"/><text x="626" y="396" font-size="20" fill="#b3484e" font-weight="400">Danger</text><circle cx="886" cy="389" r="7" fill="#287b59"/><text x="906" y="396" font-size="20" fill="#287b59" font-weight="400">Success</text><text x="36" y="446" font-size="18" fill="#666" font-weight="400">点阵：92% 主题强调色 + 8% 中性灰；深色模式仍跟随主题色。</text></g></svg>
